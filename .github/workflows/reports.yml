name: Update fishing reports
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency: reports
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-reports.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/reports.json && git ls-files --error-unmatch data/reports.json >/dev/null 2>&1; then exit 0; fi
          git config user.name "fishing-reports-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json
          git commit -m "Update fishing reports"
          git push
